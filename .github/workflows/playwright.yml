name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Create env file
      # Public OrangeHRM demo credentials (same ones documented in .env.example).
      # Override via repo secrets (BASE_URL / DEMO_USERNAME / DEMO_PASSWORD) if
      # pointing this pipeline at a non-public target in the future.
      run: |
        echo "BASE_URL=${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}" >> .env.qa
        echo "USERNAME=${{ secrets.DEMO_USERNAME || 'Admin' }}" >> .env.qa
        echo "PASSWORD=${{ secrets.DEMO_PASSWORD || 'admin123' }}" >> .env.qa
    - name: Run Playwright tests
      # @regression is applied to every scenario (see feature file tags), so
      # this runs the full suite. bddgen must run first to generate the spec
      # files playwright-bdd's testDir points at; `npx playwright test` alone
      # (the previous step here) silently ran only tests/setup and skipped
      # all 11 BDD scenarios.
      run: npm run test:regression
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
